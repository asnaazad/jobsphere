name: JobSphere Microservices CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # JOB 1: TEST & VERIFY BACKEND MICROSERVICES
  # ==========================================
  test-backend:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - job-service
          - application-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'

      - name: Install Service Dependencies
        working-directory: ./${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Python Syntax & Flask App Import
        working-directory: ./${{ matrix.service }}
        env:
          JWT_SECRET: "ci-test-secret"
        run: |
          python -m py_compile app.py
          python -c "import app; print('${{ matrix.service }} loaded successfully!')"

      - name: Run Automated Tests (if present)
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests/ directory yet - smoke check passed."
          fi

  # ==========================================
  # JOB 2: VALIDATE HELM CHART & K8S MANIFESTS
  # ==========================================
  lint-helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint JobSphere Helm Chart
        run: |
          helm lint ./jobsphere
          helm template jobsphere ./jobsphere > /dev/null

  # ==========================================
  # JOB 3: BUILD & PUSH ALL 4 DOCKER IMAGES
  # ==========================================
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-backend, lint-helm]
    # Only push images when merging/pushing to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - auth-service
          - job-service
          - application-service
          - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        working-directory: ./${{ matrix.service }}
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/jobsphere-${{ matrix.service }}"
          docker build -t "$IMAGE_NAME:${{ env.IMAGE_TAG }}" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:${{ env.IMAGE_TAG }}"
          docker push "$IMAGE_NAME:latest"