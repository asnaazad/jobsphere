apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: jobsphere
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: jobsphere
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS jobsphere;
    USE jobsphere;

    CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(120) NOT NULL,
        email VARCHAR(180) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        role ENUM('candidate', 'recruiter') NOT NULL DEFAULT 'candidate',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        INDEX idx_users_email (email)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS jobs (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(150) NOT NULL,
        company VARCHAR(150) NOT NULL,
        location VARCHAR(120) NOT NULL DEFAULT 'Remote',
        type ENUM('Full-Time', 'Part-Time', 'Internship', 'Contract', 'Remote') NOT NULL DEFAULT 'Full-Time',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        INDEX idx_jobs_type (type),
        INDEX idx_jobs_company (company)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS applications (
        id INT AUTO_INCREMENT PRIMARY KEY,
        job_id INT NOT NULL,
        candidate_id INT NOT NULL,
        status ENUM(
            'Applied',
            'Under Review',
            'Shortlisted',
            'Interview Scheduled',
            'Rejected',
            'Hired'
        ) NOT NULL DEFAULT 'Applied',
        applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE KEY uq_job_candidate (job_id, candidate_id),
        CONSTRAINT fk_applications_job
            FOREIGN KEY (job_id) REFERENCES jobs(id)
            ON DELETE CASCADE,
        CONSTRAINT fk_applications_candidate
            FOREIGN KEY (candidate_id) REFERENCES users(id)
            ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    INSERT IGNORE INTO jobs (id, title, company, location, type) VALUES
        (1, 'Cloud & DevOps Engineer', 'Stratosphere Systems', 'Bengaluru, India', 'Full-Time'),
        (2, 'Backend Python Developer', 'NexaTech Solutions', 'Remote', 'Full-Time'),
        (3, 'Kubernetes Platform Intern', 'KubeScale Labs', 'Kochi, India', 'Internship'),
        (4, 'Full Stack Software Engineer', 'Aether Digital', 'Hyderabad, India', 'Contract');

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: jobsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobsphere-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: jobsphere-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: jobsphere-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobsphere-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: initdb-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: initdb-script
          configMap:
            name: mysql-initdb

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: jobsphere
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP