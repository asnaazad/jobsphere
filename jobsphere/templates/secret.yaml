apiVersion: v1
kind: Secret
metadata:
  name: jobsphere-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | quote }}
  JWT_SECRET: {{ .Values.security.jwtSecret | quote }}