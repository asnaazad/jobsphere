apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobsphere-api-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 5001

          - path: /api/jobs(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: job-service
                port:
                  number: 5000

          - path: /api/applications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: application-service
                port:
                  number: 5002

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobsphere-frontend-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80